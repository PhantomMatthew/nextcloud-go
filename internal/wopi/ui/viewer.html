<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.FileName}} - Office</title>
<style>
html, body { margin: 0; height: 100%; overflow: hidden; }
#office_frame { border: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<form id="office_form" name="office_form" target="office_frame" action="{{.Action}}" method="post">
<input name="access_token" value="{{.Token}}" type="hidden">
<input name="access_token_ttl" value="{{.TokenTTL}}" type="hidden">
</form>
<iframe name="office_frame" id="office_frame" allowfullscreen="true"></iframe>
<script>document.getElementById("office_form").submit();</script>
</body>
</html>
